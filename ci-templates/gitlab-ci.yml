# GYWD CI/CD Template for GitLab CI
#
# Include this template in your .gitlab-ci.yml:
#
#   include:
#     - local: 'ci-templates/gitlab-ci.yml'
#
# Or reference from a remote URL:
#
#   include:
#     - remote: 'https://raw.githubusercontent.com/cyberbloke9/pmp-gywd/main/ci-templates/gitlab-ci.yml'

stages:
  - validate
  - test
  - release

variables:
  NODE_VERSION: "20"
  GYWD_STRICT: "false"

# Template: Node.js setup
.node-setup:
  image: node:${NODE_VERSION}
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
  before_script:
    - npm ci --prefer-offline

# GYWD Pre-Merge Validation
gywd:validate:
  extends: .node-setup
  stage: validate
  script:
    - |
      ARGS="validate --json"
      if [ "$GYWD_STRICT" = "true" ]; then
        ARGS="$ARGS --strict"
      fi
      node lib/ci/ci-runner.js $ARGS > gywd-report.json || true
      cat gywd-report.json
    - node lib/ci/ci-runner.js validate --markdown > gywd-report.md
    - |
      PASSED=$(node -e "const r=require('./gywd-report.json'); console.log(r.report?.passed ?? true)")
      if [ "$PASSED" = "false" ]; then
        echo "GYWD validation failed"
        cat gywd-report.md
        exit 1
      fi
      echo "GYWD validation passed"
  artifacts:
    paths:
      - gywd-report.json
      - gywd-report.md
    reports:
      dotenv: gywd-report.env
    expire_in: 30 days
    when: always
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'

# GYWD Drift Check (subset)
gywd:drift:
  extends: .node-setup
  stage: validate
  script:
    - node lib/ci/ci-runner.js validate --only drift,state-integrity --json
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# GYWD Decision Conflict Check (subset)
gywd:decisions:
  extends: .node-setup
  stage: validate
  script:
    - node lib/ci/ci-runner.js validate --only decisions --json
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# GYWD Test Health Check
gywd:test-health:
  extends: .node-setup
  stage: test
  script:
    - npm test
    - node lib/ci/ci-runner.js validate --only test-health --json
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# GYWD Release Notes Generation
gywd:release-notes:
  extends: .node-setup
  stage: release
  script:
    - node lib/ci/ci-runner.js release-notes --markdown > release-notes.md
    - cat release-notes.md
  artifacts:
    paths:
      - release-notes.md
    expire_in: 90 days
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - if: '$CI_COMMIT_BRANCH =~ /^release\//'

# Full GYWD CI Report
gywd:report:
  extends: .node-setup
  stage: release
  script:
    - node lib/ci/ci-runner.js report --json > gywd-full-report.json
    - node lib/ci/ci-runner.js report --markdown > gywd-full-report.md
  artifacts:
    paths:
      - gywd-full-report.json
      - gywd-full-report.md
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
